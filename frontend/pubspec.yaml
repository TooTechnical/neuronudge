name: frontend
description: "NeuroNudge Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ✅ Firebase Core + Auth
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2

  # ✅ Firebase UI (Auth + Google OAuth)
  firebase_ui_auth: ^1.13.1
  firebase_ui_oauth_google: ^1.2.11

  # ✅ Firestore (Cloud Database)
  cloud_firestore: ^5.1.0

  # ✅ HTTP client
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
