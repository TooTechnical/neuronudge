name: frontend
description: "NeuroNudge Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ✅ Firebase Core + Auth (keep Google sign-in)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2

  # ✅ Firebase UI (Auth + Google OAuth)
  firebase_ui_auth: ^1.13.1
  firebase_ui_oauth_google: ^1.2.11

  # ✅ Local storage (replace Firestore)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ✅ HTTP client for talking to your FastAPI
  http: ^1.2.2

  # ✅ IDs for local tasks
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
