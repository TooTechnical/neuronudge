name: Maintainer Tasks

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should the maintainer do?"
        required: true
        type: choice
        options:
          - gitignore_cleanup
          - add_secret_scanners
          - firebase_configs_ignore
          - format_flutter
          - backend_env_setup
          - create_maintenance_branch
      branch:
        description: "Target branch (default: main)"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Set up git author
        run: |
          git config user.name "NeuroNudge Maintainer Bot"
          git config user.email "bot@neuronudge.local"

      - name: Run task
        run: |
          set -euo pipefail
          TASK="${{ inputs.task }}"

          if [[ "$TASK" == "gitignore_cleanup" ]]; then
            cat > .gitignore << 'EOF'
# macOS
.DS_Store

# IDE settings
.idea/
.vscode/

# Flutter/Dart
**/build/
**/.dart_tool/
**/.flutter-plugins
**/.flutter-plugins-dependencies
**/.metadata
**/pubspec.lock

# Gradle
**/.gradle/
**/gradle/
**/local.properties

# Xcode
**/DerivedData/
**/*.xcworkspace/
**/*.xcuserstate
**/*.xcuserdatad
*.xcconfig

# Python (backend)
__pycache__/
*.pyc
*.pyo
*.pyd
*.env
.env
venv/
.venv/

# Node
node_modules/

# Logs
*.log

# OS metadata
Thumbs.db
EOF
            git rm --cached -r .idea .vscode || true
            git rm --cached -r '**/.DS_Store' || true
            git add .gitignore
            git commit -m "chore: clean .gitignore and stop tracking OS/IDE files" || echo "No changes"

          elif [[ "$TASK" == "add_secret_scanners" ]]; then
            mkdir -p .github/workflows
            cat > .github/workflows/gitleaks.yml << 'EOF'
name: gitleaks
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner --redact
EOF
            git add .github/workflows/gitleaks.yml
            git commit -m "chore: add gitleaks secret scanning" || echo "No changes"

          elif [[ "$TASK" == "firebase_configs_ignore" ]]; then
            {
              echo ""
              echo "# Firebase configs (kept local)"
              echo "frontend/android/app/google-services.json"
              echo "frontend/ios/Runner/GoogleService-Info.plist"
              echo "frontend/lib/firebase_options.dart"
            } >> .gitignore
            git rm --cached frontend/android/app/google-services.json 2>/dev/null || true
            git rm --cached frontend/ios/Runner/GoogleService-Info.plist 2>/dev/null || true
            git rm --cached frontend/lib/firebase_options.dart 2>/dev/null || true
            git add .gitignore
            git commit -m "chore: stop tracking Firebase config files" || echo "No changes"

          elif [[ "$TASK" == "format_flutter" ]]; then
            sudo apt-get update -y
            sudo snap install flutter --classic || true
            cd frontend
            flutter pub get || true
            flutter format .
            cd ..
            git add frontend
            git commit -m "chore: flutter format frontend" || echo "No changes"

          elif [[ "$TASK" == "backend_env_setup" ]]; then
            mkdir -p backend
            if ! grep -q "dotenv" backend/utils/openai_client.py 2>/dev/null; then
              python - << 'PY'
from pathlib import Path
p = Path("backend/utils/openai_client.py")
txt = p.read_text()
if "from dotenv import load_dotenv" not in txt:
    txt = "import os\nfrom dotenv import load_dotenv\nload_dotenv()\n" + txt
p.write_text(txt)
PY
              grep -q "python-dotenv" backend/requirements.txt 2>/dev/null || echo "python-dotenv>=1.0.0" >> backend/requirements.txt
              git add backend/utils/openai_client.py backend/requirements.txt
              git commit -m "chore: load OPENAI_API_KEY from .env (dotenv)" || echo "No changes"
            fi
            cat > backend/.env.example << 'EOF'
# Copy to .env and fill values locally (never commit real secrets)
OPENAI_API_KEY=sk-your-key-here
EOF
            git add backend/.env.example
            git commit -m "docs: add backend/.env.example" || echo "No changes"

          elif [[ "$TASK" == "create_maintenance_branch" ]]; then
            git checkout -b maintenance/automation || git checkout maintenance/automation
          fi

      - name: Push changes
        run: |
          git push origin HEAD:${{ inputs.branch }} || true
