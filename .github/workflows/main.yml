name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q backend/tests

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.5"
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Verify changed service, widget, and test formatting
        run: dart format --output=none --set-exit-if-changed lib/services/ai_service.dart lib/services/activation_engine.dart lib/widgets/get_started_sheet.dart test
      - name: Analyze Flutter
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
